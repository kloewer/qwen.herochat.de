<script>

/* =========================================================
API HELPERS
========================================================= */

const API_URL = 'api.php';

async function apiCall(action, data = null, customUrl = null) {
    const url = customUrl || (API_URL + '?action=' + encodeURIComponent(action));

    const options = {
        method: data ? 'POST' : 'GET',
        headers: { 'Content-Type': 'application/json' }
    };

    if (data) options.body = JSON.stringify(data);

    try {
        const response = await fetch(url, options);
        const result = await response.json();

        if (result.error) {
            console.error('API Error:', result.error);
            alert('Error: ' + result.error);
            throw new Error(result.error);
        }

        return result;
    } catch (error) {
        console.error('Fetch error:', error);
        alert('Failed to connect to API. Make sure config.php is set up with correct database credentials.');
        throw error;
    }
}


/* =========================================================
STATE
========================================================= */

let cards = [];
let activeCardId = null;


/* =========================================================
INITIALIZATION
========================================================= */

document.addEventListener("DOMContentLoaded", () => {
    loadCurrentUser();
    loadCards();
    initModal();
    initAddCardButtons();
    initKanban();
    initUserFilter();
});

/* =========================================================
CURRENT USER
========================================================= */

let currentUser = null;

async function loadCurrentUser() {
    try {
        const response = await fetch('api.php?action=get_current_user');
        const user = await response.json();
        currentUser = user;

        // Update header avatar
        if (user.email) {
            document.getElementById('userAvatar').src = '/user/' + user.email + '.png';
        }
    } catch (error) {
        console.error('Failed to load current user:', error);
    }
}

/* =========================================================
USER FILTER
========================================================= */

function initUserFilter() {
    const filter = document.getElementById('userFilter');
    filter.addEventListener('change', loadCards);
}


/* =========================================================
LOAD CARDS FROM DATABASE
========================================================= */

async function loadCards() {
    try {
        const filterValue = document.getElementById('userFilter').value;
        let url = 'api.php?action=get_cards';
        if (filterValue && filterValue !== 'all') {
            url += '&user=' + encodeURIComponent(filterValue);
        }
        cards = await apiCall('get_cards', null, url);
        renderAllCards();
    } catch (error) {
        console.error('Failed to load cards:', error);
    }
}


/* =========================================================
RENDER CARDS
========================================================= */

function renderAllCards() {
    document.getElementById('todo-list').innerHTML = '';
    document.getElementById('in_progress-list').innerHTML = '';
    document.getElementById('done-list').innerHTML = '';
    
    cards.forEach(card => renderCard(card));
}

function renderCard(card) {
    const columnId = card.column_status + '-list';
    const column = document.getElementById(columnId);
    if (!column) return;

    const doneCount = card.checklist.filter(t => t.is_done).length;
    const totalCount = card.checklist.length;
    const percent = totalCount ? (doneCount / totalCount) * 100 : 0;
    const assignedUsers = card.assigned_users || [];

    const cardEl = document.createElement('div');
    cardEl.className = 'kanban-card bg-white p-4 rounded-lg shadow';
    cardEl.dataset.cardId = card.id;

    // Build card HTML with members
    let cardHTML = `
        <div class="flex justify-between items-start">
            <h3 class="font-semibold text-gray-800 flex-1">${escapeHtml(card.title)}</h3>
            <button class="editTask text-gray-400 hover:text-gray-700 ml-2">✎</button>
        </div>

        ${card.description ? `<p class="text-sm text-gray-500 mt-1">${escapeHtml(card.description)}</p>` : ''}

        ${card.checklist.length > 0 ? `
        <div class="taskSection mt-4">
            <div class="flex justify-between text-xs text-gray-500 mb-1">
                <span>Tasks</span>
                <span class="taskProgressText">${doneCount}/${totalCount}</span>
            </div>
            <div class="bg-gray-200 h-2 rounded">
                <div class="taskProgressBar bg-blue-500 h-2 rounded" style="width: ${percent}%"></div>
            </div>
            <div class="taskList mt-3 space-y-1 text-sm">
                ${card.checklist.map(task => `
                    <label class="flex items-center gap-2 text-sm">
                        <input type="checkbox"
                               data-checklist-id="${task.id}"
                               ${task.is_done ? 'checked' : ''}
                               class="inline-checkbox">
                        <span class="${task.is_done ? 'line-through text-gray-400' : ''}">${escapeHtml(task.task)}</span>
                    </label>
                `).join('')}
            </div>
        </div>
        ` : ''}

        ${assignedUsers.length > 0 ? `
        <div class="membersSection mt-4 flex items-center justify-between">
            <div class="flex -space-x-2">
                ${assignedUsers.map(email => {
                    const displayName = email === 'kloewer@gmail.com' ? 'Christian' : (email === 'amollik@gmail.com' ? 'Alvar' : email);
                    return `<img src="/user/${encodeURIComponent(email)}.png" 
                                 alt="${displayName}" 
                                 class="w-7 h-7 rounded-full border-2 border-white object-cover"
                                 title="${displayName}"
                                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%236B7280%22><path d=%22M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-3.33 0-10 1.67-10 5v1h20v-1c0-3.33-6.67-5-10-5z%22/></svg>'">`;
                }).join('')}
            </div>
        </div>
        ` : ''}
    `;

    cardEl.innerHTML = cardHTML;
    column.appendChild(cardEl);

    // Attach event listeners
    const editBtn = cardEl.querySelector('.editTask');
    if (editBtn) {
        editBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            console.log('Edit button clicked for card:', card.id);
            openModal(card.id);
        });
    }

    cardEl.querySelectorAll('.inline-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', async (e) => {
            const checklistId = e.target.dataset.checklistId;
            const isDone = e.target.checked;

            await apiCall('toggle_checklist', { id: checklistId, is_done: isDone ? 1 : 0 });

            // Update local card state
            const cardData = cards.find(c => c.id == card.id);
            if (cardData) {
                const task = cardData.checklist.find(t => t.id == checklistId);
                if (task) task.is_done = isDone ? 1 : 0;
            }

            // Update UI
            const span = checkbox.nextElementSibling;
            if (isDone) {
                span.classList.add('line-through', 'text-gray-400');
            } else {
                span.classList.remove('line-through', 'text-gray-400');
            }

            // Update progress
            updateCardProgress(cardEl);

            // Update modal if open
            if (activeCardId === card.id) {
                renderModalTasks();
                renderActivityFeed(cardData);
            }
        });
    });
}

function updateCardProgress(cardEl) {
    const checkboxes = cardEl.querySelectorAll('.inline-checkbox');
    const doneCount = Array.from(checkboxes).filter(cb => cb.checked).length;
    const totalCount = checkboxes.length;
    const percent = totalCount ? (doneCount / totalCount) * 100 : 0;
    
    const text = cardEl.querySelector('.taskProgressText');
    const bar = cardEl.querySelector('.taskProgressBar');
    
    if (text) text.innerText = `${doneCount}/${totalCount}`;
    if (bar) bar.style.width = percent + '%';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}


/* =========================================================
MODAL
========================================================= */

function initModal() {
    const modal = document.getElementById('taskModal');
    const modalContent = modal.querySelector('.bg-white');
    const closeBtn = document.getElementById('closeModal');
    const saveBtn = document.getElementById('saveCardBtn');
    const deleteBtn = document.getElementById('deleteCardBtn');
    const addTaskBtn = document.getElementById('addTaskBtn');
    const postCommentBtn = document.getElementById('postCommentBtn');
    const addMemberBtn = document.getElementById('addMemberBtn');
    const memberDropdown = document.getElementById('memberDropdown');
    const memberCheckboxes = document.querySelectorAll('.member-checkbox');

    closeBtn.addEventListener('click', closeModal);

    // Close when clicking on the overlay (not the modal content)
    modal.addEventListener('click', e => {
        if (e.target === modal) {
            closeModal();
        }
    });

    // Close on Escape key
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
            closeModal();
        }
    });

    saveBtn.addEventListener('click', saveCard);
    deleteBtn.addEventListener('click', deleteCard);
    addTaskBtn.addEventListener('click', addTask);
    postCommentBtn.addEventListener('click', postComment);

    // Expandable comment input
    const commentInput = document.getElementById('commentInput');
    if (commentInput) {
        commentInput.addEventListener('focus', () => {
            commentInput.style.rows = '3';
            commentInput.setAttribute('rows', '3');
            commentInput.classList.add('border-blue-400');
        });

        commentInput.addEventListener('blur', () => {
            if (!commentInput.value.trim()) {
                commentInput.style.rows = '1';
                commentInput.setAttribute('rows', '1');
                commentInput.classList.remove('border-blue-400');
                postCommentBtn.classList.add('hidden');
            }
        });

        commentInput.addEventListener('input', () => {
            // Show/hide Save button based on content
            if (commentInput.value.trim()) {
                postCommentBtn.classList.remove('hidden');
            } else {
                postCommentBtn.classList.add('hidden');
            }
        });
    }

    // Member dropdown toggle
    if (addMemberBtn) {
        addMemberBtn.addEventListener('click', () => {
            memberDropdown.classList.toggle('hidden');
        });
    }
    
    // Member checkbox changes
    memberCheckboxes.forEach(checkbox => {
        checkbox.addEventListener('change', () => {
            updateAssignedMembers();
        });
    });

function formatDateTime(date) {
    const now = new Date();
    const diffMs = now - date;
    const diffMins = Math.floor(diffMs / 60000);
    const diffHours = Math.floor(diffMs / 3600000);
    const diffDays = Math.floor(diffMs / 86400000);

    if (diffMins < 1) return 'Just now';
    if (diffMins < 60) return diffMins + ' minute' + (diffMins > 1 ? 's' : '') + ' ago';
    if (diffHours < 24) return diffHours + ' hour' + (diffHours > 1 ? 's' : '') + ' ago';
    if (diffDays < 7) return diffDays + ' day' + (diffDays > 1 ? 's' : '') + ' ago';
    
    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function renderActivityFeed(card) {
    const feed = document.getElementById('activityFeed');
    const activities = [];
    const userNames = {
        'kloewer@gmail.com': 'Christian',
        'amollik@gmail.com': 'Alvar'
    };

    // Helper to get user info
    function getUserInfo(email) {
        return {
            name: userNames[email] || email.split('@')[0],
            avatar: `/user/${encodeURIComponent(email)}.png`,
            initials: email === 'kloewer@gmail.com' ? 'CK' : (email === 'amollik@gmail.com' ? 'AM' : email.substring(0, 2).toUpperCase())
        };
    }

    // Helper to format timestamp consistently
    function formatTimestamp(dateStr) {
        const date = new Date(dateStr);
        return date.toLocaleString('de-DE', { 
            day: '2-digit', month: '2-digit', year: 'numeric', 
            hour: '2-digit', minute: '2-digit'
        });
    }

    // Card creation activity (oldest - goes to bottom after reverse)
    const creatorInfo = getUserInfo(card.created_by || 'kloewer@gmail.com');
    activities.push({
        type: 'creation',
        user: creatorInfo,
        text: 'created this card',
        timestamp: formatTimestamp(card.created_at),
        sortDate: new Date(card.created_at)
    });

    // Comments (chronological order - will be sorted)
    if (card.comments && card.comments.length > 0) {
        card.comments.forEach(comment => {
            const commentUserInfo = getUserInfo(comment.user_email || 'kloewer@gmail.com');
            activities.push({
                type: 'comment',
                commentId: comment.id,
                user: commentUserInfo,
                text: 'made a comment',
                commentText: escapeHtml(comment.comment_text),
                timestamp: formatTimestamp(comment.created_at),
                sortDate: new Date(comment.created_at)
            });
        });
    }

    // Checklist activities with timestamp
    const checkedTasks = card.checklist.filter(t => t.is_done && t.checked_at);
    checkedTasks.forEach(task => {
        activities.push({
            type: 'checklist',
            user: getUserInfo(currentUser?.email || 'kloewer@gmail.com'),
            text: `checked off "${escapeHtml(task.task)}"`,
            timestamp: formatTimestamp(task.checked_at),
            sortDate: new Date(task.checked_at)
        });
    });

    // Sort by date (newest first)
    activities.sort((a, b) => b.sortDate - a.sortDate);

    // Render all activities with CONSISTENT styling
    feed.innerHTML = activities.map(activity => {
        const avatarHTML = activity.user.avatar ? 
            `<img src="${activity.user.avatar}" alt="${activity.user.name}" class="w-8 h-8 rounded-full object-cover" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%236B7280%22><path d=%22M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-3.33 0-10 1.67-10 5v1h20v-1c0-3.33-6.67-5-10-5z%22/></svg>'">` :
            `<div class="w-8 h-8 rounded-full bg-orange-500 text-white flex items-center justify-center text-xs font-bold">${activity.user.initials}</div>`;

        // All activities have the SAME consistent layout
        return `
            <div class="flex items-start gap-3 group" ${activity.type === 'comment' ? `data-comment-id="${activity.commentId}"` : ''}>
                ${avatarHTML}
                <div class="flex-1">
                    <p class="text-sm text-gray-800">
                        <span class="font-semibold">${activity.user.name}</span> ${activity.text}
                    </p>
                    ${activity.type === 'comment' ? `
                        <div class="mt-2 bg-white border rounded-lg p-3 text-sm text-gray-800 shadow-sm">
                            ${activity.commentText.replace(/\n/g, '<br>')}
                        </div>
                    ` : ''}
                    <a href="#" class="text-xs text-blue-600 hover:underline mt-1 block">${activity.timestamp}</a>
                    ${activity.type === 'comment' ? `
                        <button class="delete-comment text-xs text-gray-500 hover:text-red-600 opacity-0 group-hover:opacity-100 transition-opacity mt-1">
                            Delete
                        </button>
                    ` : ''}
                </div>
            </div>
        `;
    }).join('');

    // Attach delete comment listeners
    feed.querySelectorAll('.delete-comment').forEach(btn => {
        btn.addEventListener('click', async (e) => {
            e.preventDefault();
            const commentId = e.currentTarget.closest('[data-comment-id]').dataset.commentId;
            if (confirm('Delete this comment?')) {
                await apiCall('delete_comment', { id: commentId });
                // Remove from local state
                card.comments = card.comments.filter(c => c.id != commentId);
                renderActivityFeed(card);
            }
        });
    });
}

function initAddCardButtons() {
    // Show input form when clicking "Add new card" button
    document.querySelectorAll('.add-card-trigger').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const form = btn.closest('.add-card-form');
            const wrapper = form.querySelector('.add-card-input-wrapper');
            const textarea = form.querySelector('textarea');
            
            wrapper.classList.remove('hidden');
            btn.classList.add('hidden');
            textarea.focus();
        });
    });

    // Hide form when clicking cancel
    document.querySelectorAll('.add-card-cancel').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            hideAddCardForm(btn.closest('.add-card-form'));
        });
    });

    // Submit card on button click
    document.querySelectorAll('.add-card-submit').forEach(btn => {
        btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const form = btn.closest('.add-card-form');
            const textarea = form.querySelector('textarea');
            const title = textarea.value.trim();
            
            if (!title) {
                textarea.focus();
                return;
            }

            await submitNewCard(form, textarea);
        });
    });

    // Handle ENTER key to submit, SHIFT+ENTER for new line
    document.querySelectorAll('.add-card-form textarea').forEach(textarea => {
        textarea.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                e.stopPropagation();
                
                const title = textarea.value.trim();
                if (!title) return;

                const form = textarea.closest('.add-card-form');
                await submitNewCard(form, textarea);
            }
        });
    });

    // Auto-resize textarea
    document.querySelectorAll('.add-card-form textarea').forEach(textarea => {
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        });
    });

    // Close on Escape
    document.querySelectorAll('.add-card-form textarea').forEach(textarea => {
        textarea.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                e.stopPropagation();
                const form = textarea.closest('.add-card-form');
                hideAddCardForm(form);
            }
        });
    });

    // Close all forms when clicking elsewhere on the page
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.add-card-form')) {
            document.querySelectorAll('.add-card-form').forEach(form => {
                hideAddCardForm(form);
            });
        }
    });
}

function hideAddCardForm(form) {
    const wrapper = form.querySelector('.add-card-input-wrapper');
    const textarea = form.querySelector('textarea');
    const trigger = form.querySelector('.add-card-trigger');
    
    textarea.value = '';
    textarea.style.height = 'auto';
    wrapper.classList.add('hidden');
    trigger.classList.remove('hidden');
}

async function submitNewCard(form, textarea) {
    const title = textarea.value.trim();
    const column = textarea.dataset.column;
    const cardCount = document.getElementById(column + '-list').children.length;

    const result = await apiCall('create_card', {
        title,
        description: '',
        column_status: column,
        position: cardCount
    });

    cards.push({
        id: result.id,
        title,
        description: '',
        column_status: column,
        position: cardCount,
        checklist: []
    });

    renderAllCards();

    // Clear and keep focus for adding another card
    textarea.value = '';
    textarea.style.height = 'auto';
    textarea.focus();
}

                const cardId = cardEl.dataset.cardId;
                const newColumn = evt.to.closest('[data-column]').dataset.column;
                const newPosition = Array.from(evt.to.children).indexOf(cardEl);
                
                const card = cards.find(c => c.id == cardId);
                if (!card) return;
                
                // Update local state
                card.column_status = newColumn;
                card.position = newPosition;

                // Send to server
                await apiCall('move_card', {
                    id: cardId,
                    column_status: newColumn,
                    position: newPosition
                });
            }
        });
    });
}

</script>
