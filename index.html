<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Kanban Board</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>

<body class="bg-gray-100 p-8">

<div class="max-w-7xl mx-auto grid md:grid-cols-3 gap-6">

<!-- ===================================================== -->
<!-- TO DO -->
<!-- ===================================================== -->

<div class="bg-gray-50 p-4 rounded-xl" data-column="todo">

<h2 class="font-semibold text-gray-700 mb-4">To Do</h2>

<div class="kanban-list space-y-4" id="todo-list"></div>

<button class="add-card-btn mt-4 w-full border-2 border-dashed rounded-lg py-2 text-gray-500 hover:bg-gray-200" data-column="todo">
+ Add new card
</button>

</div>


<!-- ===================================================== -->
<!-- IN PROGRESS -->
<!-- ===================================================== -->

<div class="bg-gray-50 p-4 rounded-xl" data-column="in_progress">

<h2 class="font-semibold text-gray-700 mb-4">In Progress</h2>

<div class="kanban-list space-y-4" id="in_progress-list"></div>

<button class="add-card-btn mt-4 w-full border-2 border-dashed rounded-lg py-2 text-gray-500 hover:bg-gray-200" data-column="in_progress">
+ Add new card
</button>

</div>


<!-- ===================================================== -->
<!-- DONE -->
<!-- ===================================================== -->

<div class="bg-gray-50 p-4 rounded-xl" data-column="done">

<h2 class="font-semibold text-gray-700 mb-4">Done</h2>

<div class="kanban-list space-y-4" id="done-list"></div>

<button class="add-card-btn mt-4 w-full border-2 border-dashed rounded-lg py-2 text-gray-500 hover:bg-gray-200" data-column="done">
+ Add new card
</button>

</div>

</div>


<!-- =====================================================
MODAL
===================================================== -->

<div id="taskModal"
     class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-6 overflow-y-auto z-50">

    <div class="bg-white rounded-xl shadow-xl w-[800px] max-w-full">

        <!-- HEADER -->

        <div class="flex justify-between items-center px-6 py-4 border-b">

            <h2 class="text-xl font-semibold">Edit Card</h2>

            <button id="closeModal" class="text-gray-500 text-xl hover:text-gray-700">×</button>

        </div>


        <!-- CONTENT -->

        <div class="p-6 grid grid-cols-2 gap-8">

            <!-- LEFT SIDE -->

            <div>

                <label class="text-sm text-gray-600">Title</label>
                <input type="text" id="modalCardTitle" class="w-full border rounded-lg p-2 mt-1">

                <label class="text-sm text-gray-600 mt-4 block">Description</label>
                <textarea id="modalCardDescription" class="w-full border rounded-lg p-3 mt-1 h-32"></textarea>


                <!-- TASKS -->

                <h3 class="mt-6 font-semibold text-gray-700">Tasks</h3>

                <div id="modalTaskList" class="space-y-2 mt-3"></div>

                <button id="addTaskBtn" class="mt-2 border rounded-lg px-3 py-1 text-sm hover:bg-gray-100">
                    + Add task
                </button>

            </div>


            <!-- RIGHT SIDE -->

            <div>

                <label class="text-sm text-gray-600">Status</label>
                <select id="modalCardStatus" class="w-full border rounded-lg p-2 mt-1">
                    <option value="todo">To Do</option>
                    <option value="in_progress">In Progress</option>
                    <option value="done">Done</option>
                </select>

                <div class="mt-4 p-4 bg-gray-50 rounded-lg">
                    <p class="text-sm text-gray-600">
                        <strong>Tip:</strong> Drag cards between columns to move them. 
                        Click checkboxes directly on cards or use this modal.
                    </p>
                </div>

            </div>

        </div>


        <!-- FOOTER -->

        <div class="flex justify-between items-center border-t px-6 py-4">

            <button id="deleteCardBtn" class="text-red-600 hover:text-red-700">Delete Card</button>

            <div>
                <button id="saveCardBtn" class="bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700">Save</button>
            </div>

        </div>

    </div>

</div>

<script>

/* =========================================================
API HELPERS
========================================================= */

const API_URL = 'api.php';

async function apiCall(action, data = null) {
    const url = new URL(API_URL);
    url.searchParams.set('action', action);
    
    const options = {
        method: data ? 'POST' : 'GET',
        headers: { 'Content-Type': 'application/json' }
    };
    
    if (data) options.body = JSON.stringify(data);
    
    const response = await fetch(url, options);
    return await response.json();
}


/* =========================================================
STATE
========================================================= */

let cards = [];
let activeCardId = null;


/* =========================================================
INITIALIZATION
========================================================= */

document.addEventListener("DOMContentLoaded", () => {
    loadCards();
    initModal();
    initAddCardButtons();
    initKanban();
});


/* =========================================================
LOAD CARDS FROM DATABASE
========================================================= */

async function loadCards() {
    try {
        cards = await apiCall('get_cards');
        renderAllCards();
    } catch (error) {
        console.error('Failed to load cards:', error);
    }
}


/* =========================================================
RENDER CARDS
========================================================= */

function renderAllCards() {
    document.getElementById('todo-list').innerHTML = '';
    document.getElementById('in_progress-list').innerHTML = '';
    document.getElementById('done-list').innerHTML = '';
    
    cards.forEach(card => renderCard(card));
}

function renderCard(card) {
    const columnId = card.column_status + '-list';
    const column = document.getElementById(columnId);
    if (!column) return;
    
    const doneCount = card.checklist.filter(t => t.is_done).length;
    const totalCount = card.checklist.length;
    const percent = totalCount ? (doneCount / totalCount) * 100 : 0;
    
    const cardEl = document.createElement('div');
    cardEl.className = 'kanban-card bg-white p-4 rounded-lg shadow';
    cardEl.dataset.cardId = card.id;
    
    cardEl.innerHTML = `
        <div class="flex justify-between">
            <h3 class="font-semibold text-gray-800">${escapeHtml(card.title)}</h3>
            <button class="editTask text-gray-400 hover:text-gray-700">✎</button>
        </div>
        
        ${card.description ? `<p class="text-sm text-gray-500 mt-1">${escapeHtml(card.description)}</p>` : ''}
        
        ${card.checklist.length > 0 ? `
        <div class="taskSection mt-4">
            <div class="flex justify-between text-xs text-gray-500 mb-1">
                <span>Tasks</span>
                <span class="taskProgressText">${doneCount}/${totalCount}</span>
            </div>
            <div class="bg-gray-200 h-2 rounded">
                <div class="taskProgressBar bg-blue-500 h-2 rounded" style="width: ${percent}%"></div>
            </div>
            <div class="taskList mt-3 space-y-1 text-sm">
                ${card.checklist.map(task => `
                    <label class="flex items-center gap-2 text-sm">
                        <input type="checkbox" 
                               data-checklist-id="${task.id}" 
                               ${task.is_done ? 'checked' : ''}
                               class="inline-checkbox">
                        <span class="${task.is_done ? 'line-through text-gray-400' : ''}">${escapeHtml(task.task)}</span>
                    </label>
                `).join('')}
            </div>
        </div>
        ` : ''}
    `;
    
    column.appendChild(cardEl);
    
    // Attach event listeners
    cardEl.querySelector('.editTask').addEventListener('click', () => openModal(card.id));
    
    cardEl.querySelectorAll('.inline-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', async (e) => {
            const checklistId = e.target.dataset.checklistId;
            const isDone = e.target.checked;
            
            await apiCall('toggle_checklist', { id: checklistId, is_done: isDone ? 1 : 0 });
            
            // Update UI
            const span = checkbox.nextElementSibling;
            if (isDone) {
                span.classList.add('line-through', 'text-gray-400');
            } else {
                span.classList.remove('line-through', 'text-gray-400');
            }
            
            // Update progress
            updateCardProgress(cardEl);
            
            // Update modal if open
            if (activeCardId === card.id) {
                renderModalTasks();
            }
        });
    });
}

function updateCardProgress(cardEl) {
    const checkboxes = cardEl.querySelectorAll('.inline-checkbox');
    const doneCount = Array.from(checkboxes).filter(cb => cb.checked).length;
    const totalCount = checkboxes.length;
    const percent = totalCount ? (doneCount / totalCount) * 100 : 0;
    
    const text = cardEl.querySelector('.taskProgressText');
    const bar = cardEl.querySelector('.taskProgressBar');
    
    if (text) text.innerText = `${doneCount}/${totalCount}`;
    if (bar) bar.style.width = percent + '%';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}


/* =========================================================
MODAL
========================================================= */

function initModal() {
    const modal = document.getElementById('taskModal');
    const closeBtn = document.getElementById('closeModal');
    const saveBtn = document.getElementById('saveCardBtn');
    const deleteBtn = document.getElementById('deleteCardBtn');
    const addTaskBtn = document.getElementById('addTaskBtn');
    
    closeBtn.addEventListener('click', closeModal);
    
    modal.addEventListener('click', e => {
        if (e.target === modal) closeModal();
    });
    
    saveBtn.addEventListener('click', saveCard);
    deleteBtn.addEventListener('click', deleteCard);
    addTaskBtn.addEventListener('click', addTask);
}

function openModal(cardId) {
    activeCardId = cardId;
    const card = cards.find(c => c.id == cardId);
    if (!card) return;
    
    document.getElementById('modalCardTitle').value = card.title;
    document.getElementById('modalCardDescription').value = card.description || '';
    document.getElementById('modalCardStatus').value = card.column_status;
    
    renderModalTasks();
    
    document.getElementById('taskModal').classList.remove('hidden');
}

function closeModal() {
    document.getElementById('taskModal').classList.add('hidden');
    activeCardId = null;
}

function renderModalTasks() {
    const card = cards.find(c => c.id == activeCardId);
    if (!card) return;
    
    const list = document.getElementById('modalTaskList');
    
    list.innerHTML = card.checklist.map(task => `
        <div class="flex items-center justify-between group">
            <label class="flex items-center gap-2 w-full">
                <input type="checkbox"
                       data-checklist-id="${task.id}"
                       ${task.is_done ? 'checked' : ''}
                       class="modal-checkbox">
                <input type="text"
                       class="taskInput w-full bg-transparent focus:outline-none border-b border-transparent focus:border-gray-300"
                       data-checklist-id="${task.id}"
                       value="${escapeHtml(task.task)}">
            </label>
            <button class="deleteTask text-gray-400 opacity-0 group-hover:opacity-100 ml-2 hover:text-red-500" 
                    data-checklist-id="${task.id}">×</button>
        </div>
    `).join('');
    
    // Attach listeners
    list.querySelectorAll('.modal-checkbox').forEach(cb => {
        cb.addEventListener('change', async (e) => {
            const checklistId = e.target.dataset.checklistId;
            const isDone = e.target.checked;
            await apiCall('toggle_checklist', { id: checklistId, is_done: isDone ? 1 : 0 });
            
            // Update card in local state
            const task = card.checklist.find(t => t.id == checklistId);
            if (task) task.is_done = isDone ? 1 : 0;
            
            // Re-render card
            renderAllCards();
        });
    });
    
    list.querySelectorAll('.taskInput').forEach(input => {
        input.addEventListener('input', async (e) => {
            const checklistId = e.target.dataset.checklistId;
            const newTask = e.target.value;
            await apiCall('update_checklist', { id: checklistId, task: newTask });
            
            // Update card in local state
            const task = card.checklist.find(t => t.id == checklistId);
            if (task) task.task = newTask;
            
            // Re-render card
            renderAllCards();
        });
    });
    
    list.querySelectorAll('.deleteTask').forEach(btn => {
        btn.addEventListener('click', async (e) => {
            const checklistId = e.target.dataset.checklistId;
            await apiCall('delete_checklist', { id: checklistId });
            
            // Remove from local state
            card.checklist = card.checklist.filter(t => t.id != checklistId);
            
            renderModalTasks();
            renderAllCards();
        });
    });
}


/* =========================================================
CARD OPERATIONS
========================================================= */

async function saveCard() {
    const title = document.getElementById('modalCardTitle').value;
    const description = document.getElementById('modalCardDescription').value;
    const column_status = document.getElementById('modalCardStatus').value;
    
    const card = cards.find(c => c.id == activeCardId);
    if (!card) return;
    
    await apiCall('update_card', {
        id: activeCardId,
        title,
        description,
        column_status,
        position: card.position
    });
    
    // Update local state
    card.title = title;
    card.description = description;
    card.column_status = column_status;
    
    closeModal();
    renderAllCards();
}

async function deleteCard() {
    if (!confirm('Are you sure you want to delete this card?')) return;
    
    await apiCall('delete_card', { id: activeCardId });
    
    // Remove from local state
    cards = cards.filter(c => c.id != activeCardId);
    
    closeModal();
    renderAllCards();
}


/* =========================================================
TASK OPERATIONS
========================================================= */

async function addTask() {
    const card = cards.find(c => c.id == activeCardId);
    if (!card) return;
    
    const result = await apiCall('add_checklist', {
        card_id: activeCardId,
        task: 'New task',
        is_done: 0,
        position: card.checklist.length
    });
    
    card.checklist.push({
        id: result.id,
        task: 'New task',
        is_done: 0,
        position: card.checklist.length
    });
    
    renderModalTasks();
    renderAllCards();
}


/* =========================================================
ADD NEW CARD
========================================================= */

function initAddCardButtons() {
    document.querySelectorAll('.add-card-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
            const column = e.target.dataset.column;
            const title = prompt('Enter card title:');
            if (!title) return;
            
            const cardCount = document.getElementById(column + '-list').children.length;
            
            const result = await apiCall('create_card', {
                title,
                description: '',
                column_status: column,
                position: cardCount
            });
            
            cards.push({
                id: result.id,
                title,
                description: '',
                column_status: column,
                position: cardCount,
                checklist: []
            });
            
            renderAllCards();
        });
    });
}


/* =========================================================
KANBAN DRAG AND DROP
========================================================= */

function initKanban() {
    document.querySelectorAll('.kanban-list').forEach(list => {
        new Sortable(list, {
            group: 'kanban',
            animation: 150,
            onEnd: async (evt) => {
                const cardEl = evt.item;
                const cardId = cardEl.dataset.cardId;
                const newColumn = evt.to.closest('[data-column]').dataset.column;
                const newPosition = Array.from(evt.to.children).indexOf(cardEl);
                
                const card = cards.find(c => c.id == cardId);
                if (!card) return;
                
                // Update local state
                card.column_status = newColumn;
                card.position = newPosition;
                
                // Send to server
                await apiCall('move_card', {
                    id: cardId,
                    column_status: newColumn,
                    position: newPosition
                });
            }
        });
    });
}

</script>

</body>
</html>
