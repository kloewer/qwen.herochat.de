<script>

/* =========================================================
API HELPERS
========================================================= */

const API_URL = 'api.php';

async function apiCall(action, data = null) {
    const url = API_URL + '?action=' + encodeURIComponent(action);

    const options = {
        method: data ? 'POST' : 'GET',
        headers: { 'Content-Type': 'application/json' }
    };

    if (data) options.body = JSON.stringify(data);

    try {
        const response = await fetch(url, options);
        const result = await response.json();

        if (result.error) {
            console.error('API Error:', result.error);
            alert('Error: ' + result.error);
            throw new Error(result.error);
        }

        return result;
    } catch (error) {
        console.error('Fetch error:', error);
        alert('Failed to connect to API. Make sure config.php is set up with correct database credentials.');
        throw error;
    }
}


/* =========================================================
STATE
========================================================= */

let cards = [];
let activeCardId = null;


/* =========================================================
INITIALIZATION
========================================================= */

document.addEventListener("DOMContentLoaded", () => {
    loadCards();
    initModal();
    initAddCardButtons();
    initKanban();
});


/* =========================================================
LOAD CARDS FROM DATABASE
========================================================= */

async function loadCards() {
    try {
        cards = await apiCall('get_cards');
        renderAllCards();
    } catch (error) {
        console.error('Failed to load cards:', error);
    }
}


/* =========================================================
RENDER CARDS
========================================================= */

function renderAllCards() {
    document.getElementById('todo-list').innerHTML = '';
    document.getElementById('in_progress-list').innerHTML = '';
    document.getElementById('done-list').innerHTML = '';
    
    cards.forEach(card => renderCard(card));
}

function renderCard(card) {
    const columnId = card.column_status + '-list';
    const column = document.getElementById(columnId);
    if (!column) return;
    
    const doneCount = card.checklist.filter(t => t.is_done).length;
    const totalCount = card.checklist.length;
    const percent = totalCount ? (doneCount / totalCount) * 100 : 0;
    
    const cardEl = document.createElement('div');
    cardEl.className = 'kanban-card bg-white p-4 rounded-lg shadow';
    cardEl.dataset.cardId = card.id;
    
    cardEl.innerHTML = `
        <div class="flex justify-between">
            <h3 class="font-semibold text-gray-800">${escapeHtml(card.title)}</h3>
            <button class="editTask text-gray-400 hover:text-gray-700">✎</button>
        </div>
        
        ${card.description ? `<p class="text-sm text-gray-500 mt-1">${escapeHtml(card.description)}</p>` : ''}
        
        ${card.checklist.length > 0 ? `
        <div class="taskSection mt-4">
            <div class="flex justify-between text-xs text-gray-500 mb-1">
                <span>Tasks</span>
                <span class="taskProgressText">${doneCount}/${totalCount}</span>
            </div>
            <div class="bg-gray-200 h-2 rounded">
                <div class="taskProgressBar bg-blue-500 h-2 rounded" style="width: ${percent}%"></div>
            </div>
            <div class="taskList mt-3 space-y-1 text-sm">
                ${card.checklist.map(task => `
                    <label class="flex items-center gap-2 text-sm">
                        <input type="checkbox" 
                               data-checklist-id="${task.id}" 
                               ${task.is_done ? 'checked' : ''}
                               class="inline-checkbox">
                        <span class="${task.is_done ? 'line-through text-gray-400' : ''}">${escapeHtml(task.task)}</span>
                    </label>
                `).join('')}
            </div>
        </div>
        ` : ''}
    `;
    
    column.appendChild(cardEl);

    // Attach event listeners
    const editBtn = cardEl.querySelector('.editTask');
    if (editBtn) {
        editBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            console.log('Edit button clicked for card:', card.id);
            openModal(card.id);
        });
    }

    cardEl.querySelectorAll('.inline-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', async (e) => {
            const checklistId = e.target.dataset.checklistId;
            const isDone = e.target.checked;
            
            await apiCall('toggle_checklist', { id: checklistId, is_done: isDone ? 1 : 0 });
            
            // Update UI
            const span = checkbox.nextElementSibling;
            if (isDone) {
                span.classList.add('line-through', 'text-gray-400');
            } else {
                span.classList.remove('line-through', 'text-gray-400');
            }
            
            // Update progress
            updateCardProgress(cardEl);
            
            // Update modal if open
            if (activeCardId === card.id) {
                renderModalTasks();
            }
        });
    });
}

function updateCardProgress(cardEl) {
    const checkboxes = cardEl.querySelectorAll('.inline-checkbox');
    const doneCount = Array.from(checkboxes).filter(cb => cb.checked).length;
    const totalCount = checkboxes.length;
    const percent = totalCount ? (doneCount / totalCount) * 100 : 0;
    
    const text = cardEl.querySelector('.taskProgressText');
    const bar = cardEl.querySelector('.taskProgressBar');
    
    if (text) text.innerText = `${doneCount}/${totalCount}`;
    if (bar) bar.style.width = percent + '%';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}


/* =========================================================
MODAL
========================================================= */

function initModal() {
    const modal = document.getElementById('taskModal');
    const modalContent = modal.querySelector('.bg-white');
    const closeBtn = document.getElementById('closeModal');
    const saveBtn = document.getElementById('saveCardBtn');
    const deleteBtn = document.getElementById('deleteCardBtn');
    const addTaskBtn = document.getElementById('addTaskBtn');
    const postCommentBtn = document.getElementById('postCommentBtn');

    closeBtn.addEventListener('click', closeModal);

    // Close when clicking on the overlay (not the modal content)
    modal.addEventListener('click', e => {
        if (e.target === modal) {
            closeModal();
        }
    });

    // Close on Escape key
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
            closeModal();
        }
    });

    saveBtn.addEventListener('click', saveCard);
    deleteBtn.addEventListener('click', deleteCard);
    addTaskBtn.addEventListener('click', addTask);
    postCommentBtn.addEventListener('click', postComment);
}

function openModal(cardId) {
    console.log('Opening modal for card:', cardId);
    activeCardId = cardId;
    const card = cards.find(c => c.id == cardId);
    if (!card) {
        console.error('Card not found:', cardId);
        return;
    }

    document.getElementById('modalCardTitle').value = card.title;
    document.getElementById('modalCardDescription').value = card.description || '';
    document.getElementById('modalCardStatus').value = card.column_status;

    renderModalTasks();
    renderActivityFeed(card);

    const modal = document.getElementById('taskModal');
    modal.classList.remove('hidden');
    console.log('Modal opened, hidden class removed');
    
    // Focus on title input
    setTimeout(() => {
        document.getElementById('modalCardTitle').focus();
    }, 100);
}

function closeModal() {
    const modal = document.getElementById('taskModal');
    modal.classList.add('hidden');
    activeCardId = null;
}

function formatDateTime(date) {
    const now = new Date();
    const diffMs = now - date;
    const diffMins = Math.floor(diffMs / 60000);
    const diffHours = Math.floor(diffMs / 3600000);
    const diffDays = Math.floor(diffMs / 86400000);

    if (diffMins < 1) return 'Just now';
    if (diffMins < 60) return diffMins + ' minute' + (diffMins > 1 ? 's' : '') + ' ago';
    if (diffHours < 24) return diffHours + ' hour' + (diffHours > 1 ? 's' : '') + ' ago';
    if (diffDays < 7) return diffDays + ' day' + (diffDays > 1 ? 's' : '') + ' ago';
    
    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function renderActivityFeed(card) {
    const feed = document.getElementById('activityFeed');
    const activities = [];

    // Card creation activity
    activities.push({
        icon: '●',
        iconBg: 'bg-blue-500',
        text: `<span class="font-medium text-gray-800">You</span> created this card`,
        time: formatDateTime(new Date(card.created_at))
    });

    // Column move activities (would need history tracking - placeholder for now)
    
    // Checklist activities
    card.checklist.forEach(task => {
        if (task.is_done) {
            activities.push({
                icon: '✓',
                iconBg: 'bg-green-500',
                text: `<span class="font-medium text-gray-800">You</span> checked off <span class="font-medium">"${escapeHtml(task.task)}"</span>`,
                time: ''
            });
        }
    });

    feed.innerHTML = activities.map(activity => `
        <div class="flex items-start gap-3">
            <div class="w-8 h-8 rounded-full ${activity.iconBg} text-white flex items-center justify-center text-sm font-medium flex-shrink-0">
                ${activity.icon}
            </div>
            <div class="flex-1">
                <p class="text-sm text-gray-600">${activity.text}</p>
                ${activity.time ? `<p class="text-xs text-gray-400 mt-1">${activity.time}</p>` : ''}
            </div>
        </div>
    `).join('');
}

function postComment() {
    const commentInput = document.getElementById('commentInput');
    const commentText = commentInput.value.trim();
    
    if (!commentText) return;
    
    // Add comment to activity feed (locally for now - would need DB storage)
    const feed = document.getElementById('activityFeed');
    const commentEl = document.createElement('div');
    commentEl.className = 'flex items-start gap-3';
    commentEl.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-purple-500 text-white flex items-center justify-center text-sm font-medium flex-shrink-0">
            U
        </div>
        <div class="flex-1 bg-white rounded-lg p-3 shadow-sm">
            <p class="text-sm text-gray-800">${escapeHtml(commentText)}</p>
            <p class="text-xs text-gray-400 mt-1">Just now</p>
        </div>
    `;
    feed.insertBefore(commentEl, feed.firstChild);
    
    commentInput.value = '';
    
    // TODO: Save comment to database when comments table is added
}

function renderModalTasks() {
    const card = cards.find(c => c.id == activeCardId);
    if (!card) return;

    const list = document.getElementById('modalTaskList');

    list.innerHTML = card.checklist.map(task => `
        <div class="group flex items-center gap-3 p-2 rounded-lg hover:bg-gray-100 ${task.is_done ? 'opacity-60' : ''}">
            <input type="checkbox"
                   data-checklist-id="${task.id}"
                   ${task.is_done ? 'checked' : ''}
                   class="modal-checkbox w-5 h-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
            <input type="text"
                   class="taskInput flex-1 bg-transparent focus:outline-none text-gray-800 ${task.is_done ? 'line-through text-gray-400' : ''}"
                   data-checklist-id="${task.id}"
                   value="${escapeHtml(task.task)}">
            <button class="deleteTask text-gray-400 opacity-0 group-hover:opacity-100 hover:text-red-500 transition-opacity"
                    data-checklist-id="${task.id}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            </button>
        </div>
    `).join('');

    // Attach listeners
    list.querySelectorAll('.modal-checkbox').forEach(cb => {
        cb.addEventListener('change', async (e) => {
            const checklistId = e.target.dataset.checklistId;
            const isDone = e.target.checked;
            await apiCall('toggle_checklist', { id: checklistId, is_done: isDone ? 1 : 0 });

            // Update card in local state
            const task = card.checklist.find(t => t.id == checklistId);
            if (task) task.is_done = isDone ? 1 : 0;

            // Re-render card and modal tasks
            renderAllCards();
            renderModalTasks();
            renderActivityFeed(card);
        });
    });

    list.querySelectorAll('.taskInput').forEach(input => {
        input.addEventListener('input', async (e) => {
            const checklistId = e.target.dataset.checklistId;
            const newTask = e.target.value;
            await apiCall('update_checklist', { id: checklistId, task: newTask });

            // Update card in local state
            const task = card.checklist.find(t => t.id == checklistId);
            if (task) task.task = newTask;

            // Re-render card
            renderAllCards();
        });
    });

    list.querySelectorAll('.deleteTask').forEach(btn => {
        btn.addEventListener('click', async (e) => {
            const checklistId = e.target.dataset.checklistId;
            await apiCall('delete_checklist', { id: checklistId });

            // Remove from local state
            card.checklist = card.checklist.filter(t => t.id != checklistId);
            
            renderModalTasks();
            renderAllCards();
        });
    });
}


/* =========================================================
CARD OPERATIONS
========================================================= */

async function saveCard() {
    const title = document.getElementById('modalCardTitle').value;
    const description = document.getElementById('modalCardDescription').value;
    const column_status = document.getElementById('modalCardStatus').value;
    
    const card = cards.find(c => c.id == activeCardId);
    if (!card) return;
    
    await apiCall('update_card', {
        id: activeCardId,
        title,
        description,
        column_status,
        position: card.position
    });
    
    // Update local state
    card.title = title;
    card.description = description;
    card.column_status = column_status;
    
    closeModal();
    renderAllCards();
}

async function deleteCard() {
    if (!confirm('Are you sure you want to delete this card?')) return;
    
    await apiCall('delete_card', { id: activeCardId });
    
    // Remove from local state
    cards = cards.filter(c => c.id != activeCardId);
    
    closeModal();
    renderAllCards();
}


/* =========================================================
TASK OPERATIONS
========================================================= */

async function addTask() {
    const card = cards.find(c => c.id == activeCardId);
    if (!card) return;
    
    const result = await apiCall('add_checklist', {
        card_id: activeCardId,
        task: 'New task',
        is_done: 0,
        position: card.checklist.length
    });
    
    card.checklist.push({
        id: result.id,
        task: 'New task',
        is_done: 0,
        position: card.checklist.length
    });
    
    renderModalTasks();
    renderAllCards();
}


/* =========================================================
ADD CARD INLINE (TRELLO STYLE)
========================================================= */

function initAddCardButtons() {
    // Show input form when clicking "Add new card" button
    document.querySelectorAll('.add-card-trigger').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const form = btn.closest('.add-card-form');
            const wrapper = form.querySelector('.add-card-input-wrapper');
            const textarea = form.querySelector('textarea');
            
            wrapper.classList.remove('hidden');
            btn.classList.add('hidden');
            textarea.focus();
        });
    });

    // Hide form when clicking cancel
    document.querySelectorAll('.add-card-cancel').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            hideAddCardForm(btn.closest('.add-card-form'));
        });
    });

    // Submit card on button click
    document.querySelectorAll('.add-card-submit').forEach(btn => {
        btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const form = btn.closest('.add-card-form');
            const textarea = form.querySelector('textarea');
            const title = textarea.value.trim();
            
            if (!title) {
                textarea.focus();
                return;
            }

            await submitNewCard(form, textarea);
        });
    });

    // Handle ENTER key to submit, SHIFT+ENTER for new line
    document.querySelectorAll('.add-card-form textarea').forEach(textarea => {
        textarea.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                e.stopPropagation();
                
                const title = textarea.value.trim();
                if (!title) return;

                const form = textarea.closest('.add-card-form');
                await submitNewCard(form, textarea);
            }
        });
    });

    // Auto-resize textarea
    document.querySelectorAll('.add-card-form textarea').forEach(textarea => {
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        });
    });

    // Close on Escape
    document.querySelectorAll('.add-card-form textarea').forEach(textarea => {
        textarea.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                e.stopPropagation();
                const form = textarea.closest('.add-card-form');
                hideAddCardForm(form);
            }
        });
    });

    // Close all forms when clicking elsewhere on the page
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.add-card-form')) {
            document.querySelectorAll('.add-card-form').forEach(form => {
                hideAddCardForm(form);
            });
        }
    });
}

function hideAddCardForm(form) {
    const wrapper = form.querySelector('.add-card-input-wrapper');
    const textarea = form.querySelector('textarea');
    const trigger = form.querySelector('.add-card-trigger');
    
    textarea.value = '';
    textarea.style.height = 'auto';
    wrapper.classList.add('hidden');
    trigger.classList.remove('hidden');
}

async function submitNewCard(form, textarea) {
    const title = textarea.value.trim();
    const column = textarea.dataset.column;
    const cardCount = document.getElementById(column + '-list').children.length;

    const result = await apiCall('create_card', {
        title,
        description: '',
        column_status: column,
        position: cardCount
    });

    cards.push({
        id: result.id,
        title,
        description: '',
        column_status: column,
        position: cardCount,
        checklist: []
    });

    renderAllCards();

    // Clear and keep focus for adding another card
    textarea.value = '';
    textarea.style.height = 'auto';
    textarea.focus();
}


/* =========================================================
KANBAN DRAG AND DROP
========================================================= */

function initKanban() {
    document.querySelectorAll('.kanban-list').forEach(list => {
        new Sortable(list, {
            group: 'kanban',
            animation: 150,
            onEnd: async (evt) => {
                const cardEl = evt.item;
                const cardId = cardEl.dataset.cardId;
                const newColumn = evt.to.closest('[data-column]').dataset.column;
                const newPosition = Array.from(evt.to.children).indexOf(cardEl);
                
                const card = cards.find(c => c.id == cardId);
                if (!card) return;
                
                // Update local state
                card.column_status = newColumn;
                card.position = newPosition;

                // Send to server
                await apiCall('move_card', {
                    id: cardId,
                    column_status: newColumn,
                    position: newPosition
                });
            }
        });
    });
}
